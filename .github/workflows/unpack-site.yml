name: Publish site files
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the updated site
        run: |
          if [ ! -f PowerHouse-Auction-Hub-final2-security-hardened.zip ]; then exit 0; fi
          unzip -q PowerHouse-Auction-Hub-final2-security-hardened.zip -d /tmp/site
          cp -R /tmp/site/PowerHouse-Auction-Hub-final2-publish/. .
          rm -rf /tmp/site PowerHouse-Auction-Hub-final2-security-hardened.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish updated website files"
          git push
