name: Publish site files
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand the hardened site
        run: |
          if [ -f index.html ]; then exit 0; fi
          unzip -q PowerHouse-Auction-Hub-security-hardened.zip -d /tmp/site
          cp -R /tmp/site/PowerHouse-Auction-Hub/. .
          rm -rf /tmp/site PowerHouse-Auction-Hub-security-hardened.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish website files"
          git push
